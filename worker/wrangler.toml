# 隨選翻譯 — 免費 AI 翻譯（Cloudflare Workers 免費方案就夠用）
name = "translate-master-free"
main = "src/index.js"
compatibility_date = "2026-06-01"
workers_dev = true

# Workers AI：免費方案每天 10,000 Neurons，所有使用者共用
[ai]
binding = "AI"

# 每天的使用次數（SQLite Durable Object，免費方案可用）
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

# 每個 IP 每分鐘最多 20 次（Cloudflare Rate Limiting；period 只能是 10 或 60 秒）
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60

[vars]
# 主要模型與備用模型（Workers AI 的模型 ID）
MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
FALLBACK_MODEL = "@cf/google/gemma-4-26b-a4b-it"
# 每個安裝每天幾次
DAILY_LIMIT = "10"
# 同一個 IP 每天最多幾次（擋重複安裝；公司、學校共用網路時會多人共用這個上限）
IP_DAILY_LIMIT = "50"
# 整個服務每天最多幾次（保護 Workers AI 免費額度；改成付費方案時也是每天的費用上限）
GLOBAL_DAILY_LIMIT = "1500"
# IPv6 每段 /48 每天最多幾次（免費的 IPv6 通道一個帳號就有一整段 /48）
NET_DAILY_LIMIT = "150"
# IP 雜湊用的密鑰不放在這裡，用 Secret 設定（寫入後讀不回來）：
#   openssl rand -hex 32 | npx wrangler secret put IP_SALT
# 只接受這些擴充功能 ID（逗號分隔）：Chrome 線上應用程式商店上的隨選翻譯。
# 自己用「載入未封裝項目」測試時 ID 不一樣，要測免費 AI 的話把那個 ID 加在後面（chrome://extensions 看得到）。
EXTENSION_IDS = "hlampgljkkgcpkgkpolliamhdnbmhcea"
