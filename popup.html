<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>隨選翻譯設定</title>
<style>
  * { box-sizing: border-box; }

  :root {
    color-scheme: light dark;
    --page: #edf0f4;
    --surface: #ffffff;
    --surface-solid: #ffffff;
    --glass: rgba(255, 255, 255, 0.68);
    --glass-border: rgba(255, 255, 255, 0.78);
    --glass-highlight: rgba(255, 255, 255, 0.92);
    --glass-shadow: rgba(15, 23, 42, 0.12);
    --control: #f2f2f7;
    --control-solid: #f2f2f7;
    --control-hover: #e8e8ed;
    --text: #1d1d1f;
    --secondary: #6e6e73;
    --separator: rgba(60, 60, 67, 0.18);
    --border: rgba(60, 60, 67, 0.22);
    --accent: #007aff;
    --accent-hover: #0066d6;
    --accent-foreground: #ffffff;
    --accent-soft: rgba(0, 122, 255, 0.12);
    --focus: rgba(0, 122, 255, 0.28);
    --danger: #c9342f;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--text);
    background: var(--page);
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
  }

  body { width: 380px; }
  button, input, select { font: inherit; }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 76px;
    padding: 14px 16px 13px 18px;
    background: var(--glass);
    border-bottom: 1px solid rgba(60, 60, 67, 0.1);
    box-shadow: inset 0 1px 0 var(--glass-highlight), 0 1px 6px var(--glass-shadow);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
  }

  .app-title {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.2;
  }

  .app-state {
    margin: 3px 0 0;
    color: var(--secondary);
    font-size: 12px;
    line-height: 1.25;
  }

  .switch {
    position: relative;
    width: 44px;
    height: 44px;
    flex: 0 0 auto;
    padding: 0;
    background: transparent;
    border: 0;
    cursor: pointer;
    transition: transform 120ms var(--ease-out);
  }

  .switch::before,
  .switch::after {
    content: "";
    position: absolute;
    transition: background 180ms ease, transform 180ms var(--ease-out);
  }

  .switch::before {
    top: 11px;
    left: 3px;
    width: 38px;
    height: 22px;
    background: #a9a9ad;
    border-radius: 11px;
  }

  .switch::after {
    top: 13px;
    left: 5px;
    width: 18px;
    height: 18px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.22);
    transform: translateX(0);
  }

  .switch.on::before { background: var(--accent); }
  .switch.on::after { transform: translateX(16px); }
  .switch:active { transform: scale(0.97); }

  .main { padding: 16px; }

  .settings-group {
    overflow: hidden;
    background: var(--surface);
    border: 1px solid rgba(60, 60, 67, 0.12);
    border-radius: 12px;
    box-shadow: 0 2px 8px var(--glass-shadow);
  }

  .field { padding: 14px 15px 15px; }
  .field + .field { border-top: 1px solid var(--separator); }

  .field-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }

  label {
    font-size: 13px;
    font-weight: 600;
  }

  .field-meta {
    color: var(--secondary);
    font-size: 11px;
    text-align: right;
  }

  input, select {
    width: 100%;
    height: 44px;
    color: var(--text);
    background: var(--control);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    transition: background 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
  }

  input { padding: 0 58px 0 12px; }

  select {
    padding: 0 11px;
    cursor: pointer;
  }

  input:focus, select:focus,
  button:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }

  input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }

  .secret-wrap { position: relative; }

  .key-toggle {
    position: absolute;
    top: 0;
    right: 0;
    width: 52px;
    height: 44px;
    padding: 0;
    color: var(--accent);
    background: transparent;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: background 140ms ease, transform 120ms var(--ease-out);
  }

  .key-toggle:active { transform: scale(0.96); }

  .field-help {
    margin: 7px 0 0;
    color: var(--secondary);
    font-size: 11px;
    line-height: 1.45;
  }

  .builtin-info {
    margin-top: 8px;
    color: var(--secondary);
    font-size: 11px;
    line-height: 1.45;
  }

  [hidden] { display: none !important; }

  .usage-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 12px 4px 0;
    color: var(--secondary);
    font-size: 12px;
  }

  .usage-value {
    color: var(--text);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  .save-button {
    width: 100%;
    height: 44px;
    margin-top: 14px;
    color: var(--accent-foreground);
    background: var(--accent);
    border: 1px solid transparent;
    border-radius: 10px;
    box-shadow: 0 2px 6px var(--glass-shadow);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 140ms ease, opacity 140ms ease, transform 120ms var(--ease-out);
  }

  .save-button:active { transform: scale(0.97); }
  .save-button:disabled { cursor: wait; opacity: 0.65; }
  .save-button:disabled:active { transform: none; }

  .status {
    min-height: 18px;
    margin: 8px 2px 0;
    color: var(--accent);
    font-size: 12px;
    text-align: center;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity 160ms var(--ease-out), transform 160ms var(--ease-out);
  }

  .status.warning { color: var(--danger); }
  .status.show {
    opacity: 1;
    transform: translateY(0);
  }

  @media (hover: hover) and (pointer: fine) {
    input:hover, select:hover { background: var(--control-hover); }
    .key-toggle:hover { background: var(--accent-soft); }
    .save-button:hover { background: var(--accent-hover); }
  }

  @media (prefers-reduced-motion: reduce) {
    .switch,
    .switch::before,
    .switch::after,
    .key-toggle,
    .save-button { transition-duration: 0.01ms; }

    .switch:active,
    .key-toggle:active,
    .save-button:active { transform: none; }

    .status {
      transform: none;
      transition: opacity 120ms ease;
    }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111214;
      --surface: #1c1c1e;
      --surface-solid: #1c1c1e;
      --glass: rgba(28, 28, 30, 0.72);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-highlight: rgba(255, 255, 255, 0.22);
      --glass-shadow: rgba(0, 0, 0, 0.28);
      --control: #2c2c2e;
      --control-solid: #3a3a3c;
      --control-hover: #3a3a3c;
      --text: #f5f5f7;
      --secondary: #aeaeb2;
      --separator: rgba(84, 84, 88, 0.56);
      --border: rgba(142, 142, 147, 0.42);
      --accent: #0a84ff;
      --accent-hover: #409cff;
      --accent-foreground: #ffffff;
      --accent-soft: rgba(10, 132, 255, 0.16);
      --focus: rgba(10, 132, 255, 0.38);
      --danger: #ff6961;
    }

    .switch::before { background: #636366; }
  }

  @media (prefers-contrast: more) {
    :root {
      --separator: rgba(60, 60, 67, 0.45);
      --border: rgba(60, 60, 67, 0.68);
      --surface: var(--surface-solid);
    }

    .settings-group { border-color: var(--border); }
  }

  @media (prefers-color-scheme: dark) and (prefers-contrast: more) {
    :root {
      --separator: rgba(174, 174, 178, 0.7);
      --border: rgba(235, 235, 245, 0.76);
    }
  }

  @media (prefers-reduced-transparency: reduce) {
    .app-header {
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }

    .app-header { background: var(--surface-solid); }
  }
</style>
</head>
<body>
  <header class="app-header">
    <div>
      <h1 class="app-title">隨選翻譯</h1>
      <p class="app-state" id="app-state">選字翻譯已開啟</p>
    </div>
    <button class="switch" id="toggle-switch" type="button" role="switch" aria-checked="true" aria-label="暫停選字翻譯"></button>
  </header>

  <main class="main">
    <section class="settings-group" aria-label="翻譯設定">
    <div class="field">
      <div class="field-header">
        <label for="provider-select">翻譯方式</label>
        <span class="field-meta" id="model-note">免金鑰，本機處理</span>
      </div>
      <select id="provider-select">
        <option value="builtin">Chrome 內建翻譯（免金鑰）</option>
        <option value="gemini">Gemini · Google</option>
        <option value="minimax">MiniMax</option>
        <option value="kimi">Kimi · Moonshot</option>
        <option value="openai">OpenAI</option>
        <option value="deepseek">DeepSeek V4 Flash</option>
        <option value="claude">Claude · Anthropic</option>
      </select>
      <div class="builtin-info" id="builtin-info" role="note">在裝置上處理；首次使用可能需要下載語言套件。</div>
    </div>

    <div class="field" id="api-key-field" hidden>
      <div class="field-header">
        <label for="api-key">API 金鑰</label>
        <span class="field-meta">每個模型分開保存</span>
      </div>
      <div class="secret-wrap">
        <input type="password" id="api-key" placeholder="輸入 API 金鑰" autocomplete="off" spellcheck="false" aria-describedby="api-key-help">
        <button class="key-toggle" id="key-visibility" type="button" aria-label="顯示 API 金鑰" aria-pressed="false">顯示</button>
      </div>
      <p class="field-help" id="api-key-help">金鑰只會儲存在 Chrome 同步空間。</p>
    </div>

    <div class="field">
      <div class="field-header">
        <label for="lang-select">譯文語言</label>
        <span class="field-meta">翻譯結果的顯示語言</span>
      </div>
      <select id="lang-select">
        <option value="zh-TW">繁體中文</option>
        <option value="zh-CN">简体中文</option>
        <option value="en">English</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
      </select>
    </div>
    </section>

    <div class="usage-row" aria-label="今日翻譯用量">
      <span class="usage-label">今日翻譯</span>
      <span class="usage-value" id="quota-text">0 次</span>
    </div>

    <button class="save-button" id="save-btn" type="button">儲存設定</button>
    <p class="status" id="status-msg" role="status" aria-live="polite"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
