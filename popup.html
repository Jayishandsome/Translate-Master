<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>隨選翻譯設定</title>
<style>
  * { box-sizing: border-box; }

  :root {
    color-scheme: light;
    --page: #f2ede5;
    --surface: #fffdf8;
    --ink: #26211d;
    --muted: #746b61;
    --border: #d8cfc3;
    --border-strong: #a99d8e;
    --clay: #b45309;
    --clay-dark: #8f3f08;
    --clay-soft: #f6e8d6;
    --danger: #9a3525;
  }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: "Avenir Next", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
    background: var(--page);
  }

  body {
    width: 360px;
    border: 1px solid #3b342e;
  }
  button, input, select { font: inherit; }

  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 68px;
    padding: 13px 18px 12px;
    color: #fffaf2;
    background: #26211d;
    border-bottom: 3px solid var(--clay);
  }

  .app-title {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.3;
  }

  .app-state {
    margin: 2px 0 0;
    color: #c7bdb1;
    font-size: 11px;
  }

  .switch {
    position: relative;
    width: 42px;
    height: 24px;
    flex: 0 0 auto;
    padding: 0;
    background: #5e564e;
    border: 1px solid #756b61;
    border-radius: 12px;
    cursor: pointer;
  }

  .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    background: #fff;
    border-radius: 50%;
    transition: left 140ms ease;
  }

  .switch.on {
    background: var(--clay);
    border-color: #d07735;
  }
  .switch.on::after { left: 21px; }

  .main {
    padding: 19px 18px 16px;
    background: var(--page);
  }

  .field + .field { margin-top: 16px; }

  .field-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 7px;
  }

  label {
    font-size: 12px;
    font-weight: 700;
  }

  .field-meta {
    color: var(--muted);
    font-size: 10px;
  }

  input, select {
    width: 100%;
    height: 40px;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    font-size: 12px;
  }

  input { padding: 0 40px 0 11px; }

  select {
    padding: 0 10px;
    cursor: pointer;
  }

  input:hover, select:hover { border-color: #766a5e; }

  input:focus, select:focus,
  button:focus-visible {
    outline: 2px solid rgba(180, 83, 9, 0.25);
    outline-offset: 1px;
  }

  input:focus, select:focus {
    border-color: var(--clay);
  }

  .secret-wrap { position: relative; }

  .key-toggle {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 30px;
    height: 30px;
    padding: 0;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 3px;
    cursor: pointer;
  }

  .key-toggle:hover { color: var(--ink); background: #eee6dc; }

  .key-toggle::before {
    content: "";
    display: block;
    width: 14px;
    height: 8px;
    margin: auto;
    border: 1.5px solid currentColor;
    border-radius: 70% 20%;
    transform: rotate(45deg);
  }

  .field-help {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.5;
  }

  .builtin-info {
    margin-top: 8px;
    padding: 9px 10px;
    color: #4b3728;
    background: var(--clay-soft);
    border-left: 3px solid var(--clay);
    font-size: 11px;
    line-height: 1.5;
  }

  [hidden] { display: none !important; }

  .usage-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
    padding: 11px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
  }

  .usage-label { color: var(--muted); }
  .usage-value { font-weight: 650; }

  .save-button {
    width: 100%;
    height: 40px;
    margin-top: 16px;
    color: #fffaf2;
    background: var(--clay);
    border: 1px solid var(--clay-dark);
    border-radius: 4px;
    font-size: 12px;
    font-weight: 650;
    cursor: pointer;
    transition: background 140ms ease;
  }

  .save-button:hover { background: var(--clay-dark); }
  .save-button:disabled { cursor: wait; opacity: 0.65; }

  .status {
    min-height: 17px;
    margin: 8px 0 0;
    color: var(--clay-dark);
    font-size: 11px;
    text-align: center;
    opacity: 0;
  }

  .status.warning { color: var(--danger); }
  .status.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
  <header class="app-header">
    <div>
      <h1 class="app-title">隨選翻譯</h1>
      <p class="app-state" id="app-state">選字翻譯已開啟</p>
    </div>
    <button class="switch" id="toggle-switch" type="button" role="switch" aria-checked="true" aria-label="暫停選字翻譯"></button>
  </header>

  <main class="main">
    <div class="field">
      <div class="field-header">
        <label for="provider-select">翻譯方式</label>
        <span class="field-meta" id="model-note">免金鑰，本機處理</span>
      </div>
      <select id="provider-select">
        <option value="builtin">Chrome 內建翻譯（免金鑰）</option>
        <option value="gemini">Gemini · Google</option>
        <option value="minimax">MiniMax</option>
        <option value="kimi">Kimi · Moonshot</option>
        <option value="openai">OpenAI</option>
        <option value="deepseek">DeepSeek V4 Flash</option>
        <option value="claude">Claude · Anthropic</option>
      </select>
      <div class="builtin-info" id="builtin-info">文字留在裝置上處理。第一次翻譯時，Chrome 可能需要下載語言套件。</div>
    </div>

    <div class="field" id="api-key-field" hidden>
      <div class="field-header">
        <label for="api-key">API 金鑰</label>
        <span class="field-meta">每個模型分開保存</span>
      </div>
      <div class="secret-wrap">
        <input type="password" id="api-key" placeholder="輸入 API 金鑰" autocomplete="off" spellcheck="false">
        <button class="key-toggle" id="key-visibility" type="button" aria-label="顯示 API 金鑰" aria-pressed="false"></button>
      </div>
      <p class="field-help">金鑰只會儲存在 Chrome 同步空間。</p>
    </div>

    <div class="field">
      <div class="field-header">
        <label for="lang-select">譯文語言</label>
        <span class="field-meta">翻譯結果的顯示語言</span>
      </div>
      <select id="lang-select">
        <option value="zh-TW">繁體中文</option>
        <option value="zh-CN">简体中文</option>
        <option value="en">English</option>
        <option value="ko">한국어</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
      </select>
    </div>

    <div class="usage-row" aria-label="今日翻譯用量">
      <span class="usage-label">今日翻譯用量</span>
      <span class="usage-value" id="quota-text">0 / 100 次</span>
    </div>

    <button class="save-button" id="save-btn" type="button">儲存設定</button>
    <p class="status" id="status-msg" role="status" aria-live="polite"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
